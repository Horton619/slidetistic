# Tunable numbers. Every check declares the keys it reads in its `thresholds` list.
# Lengths are inches unless the key says otherwise.

slide_margin_in: 0.2            # how far inside the slide edge a moved text box lands
centered_shift_max_in: 0.25     # a centered box hitting the margin may shift this far; beyond → refuse
width_headroom_pct: 6           # laid-out width + this % when widening (judgment value; tune on corpus)
body_widen_max_pct: 10          # multi-line body text widens at most this much, then grows in height
height_headroom_lines: 0.5      # laid-out height + this many lines when growing height
large_file_warn_mb: 1024        # UI warns "this may take longer" above this size
target_aspect: 1.7778           # 16:9; G006 flags other slide shapes
aspect_tolerance_pct: 1
output_width_px: 1920           # M008/M009 judge images against this output width
oversize_ratio: 4               # image has 4x the pixels it's shown at → oversized (M008)
oversize_min_mb: 2              # …and the file is at least this big
low_res_ratio: 0.5              # image shown at >200% of its pixels → soft on screen (M009). Corpus: 0.75 gave 173 hits in 20 of 51 decks
low_res_min_shown_px: 480       # …and it fills at least a quarter of the screen width (small logos don't matter)
deck_size_warn_mb: 500          # X002
filename_max_chars: 120         # X002
target_play_mode: click_sequence # M001: videos must start from the clicker ("In click sequence"); "Automatically" is also fine
offslide_tolerance_in: 0.02     # G001/G002: overhangs smaller than this are ignored
safe_zone_pct: 5                # David 2026-10-10: text stays inside a 5% border on every edge
fit_min_line_spacing_pct: 85    # fit fixes never tighten line spacing below this share of the original
fit_max_font_shrink_pct: 15     # last resort: font may shrink at most this much (David 2026-10-10: raised from 10)
orphan_max_words: 1             # a paragraph's last line with this many words or fewer is an orphan
orphan_min_paragraph_words: 6   # shorter paragraphs (titles, labels: "Board of / Directors") are never orphans
overlap_max_per_slide: 12        # L010: more text-over-text collisions than this on one slide → one finding, no fix attempts
overlap_min_pt: 2               # L010/L011: overlaps thinner than this (in points) are ignored
fit_wrap_band_pct: 1             # fit prediction: PowerPoint's real text width is the box's text area ± this % (a fix must work at both ends)
fit_max_attempts_per_box: 2      # a box still showing the same layout problem after this many changes goes back as it was
fit_time_budget_s: 120           # layout fixing stops starting new fixes after this long (the safety check still runs)
fit_max_rounds: 6               # repair re-renders and re-checks layout at most this many times
compress_target_width_px: 2000  # M013: a full-width picture keeps this many pixels (PowerPoint's 150 ppi on a 13.33 in slide, a 1080p screen)
compress_jpeg_quality: 85       # M013: JPEG quality for resized photos
compress_pitch_min_pct: 25      # M013: suggest compressing when the deck would shrink by at least this %…
compress_pitch_min_mb: 5        # …and at least this many MB
video_max_height_px: 1080       # M012: videos taller than this get flagged for re-encoding to 1080p
