# Fonts that are on SOME show machines (F007 reports them yellow, not red).
# Case-insensitive. Corpus 2026-10-09: Aptos alone was in 24 of 51 real decks.

# Microsoft 365 cloud fonts: downloaded on demand by current Office when online.
# Missing on Office 2019/2021 and on machines that have never been online with M365.
office_cloud:
  - Aptos
  - Aptos Display
  - Aptos Narrow
  - Aptos Serif
  - Aptos Mono
  - Grandview
  - Grandview Display
  - Seaford
  - Seaford Display
  - Skeena
  - Skeena Display
  - Tenorite
  - Tenorite Display
  - Bierstadt
  - Bierstadt Display
  - Neue Haas Grotesk Text Pro
  - Neue Haas Grotesk Display Pro
  - Avenir Next LT Pro
  - Avenir Next LT Pro Demi
  - Avenir Next LT Pro Light
  - Abadi                      # David 2026-10-15: a deck used it; Adobe's 'Abadi MT Pro' is a different family
  - Abadi Extra Light

