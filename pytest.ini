[pytest]
testpaths = tests
addopts = -m "not corpus and not powerpoint and not slow"
markers =
    corpus: snapshot tests on real decks in the local corpus folder (not in git)
    slow: big adversarial decks (500 slides, a 2 GB file): run with `pytest -m slow`
    powerpoint: drives the real PowerPoint renderer (Mac or Windows with PowerPoint + Poppler; never in CI)
# Corpus runs copy and repair every real deck; keeping those folders filled 15 GB (2026-10-09).
tmp_path_retention_policy = none
